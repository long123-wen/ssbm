name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 取消上一次未完成的运行，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  age-bucketing:
    name: 年龄分组 / 跨组别匹配测试
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run age bucketing tests
        run: npm run test:age
